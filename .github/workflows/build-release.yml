name: Build ApexTrail OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          npm install
          python -c "import struct, zlib; w=h=512; raw=(b'\x00'+b'\x84\xcc\x16\xff'*w)*h; chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          npx tauri icon app-icon.png
          npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ApexTrail-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install Android SDK & NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export NDK_HOME="$ANDROID_NDK_HOME"
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_SDK_ROOT=$ANDROID_HOME"; echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"; echo "NDK_HOME=$NDK_HOME"; } >> "$GITHUB_ENV"
          { echo "$ANDROID_HOME/cmdline-tools/latest/bin"; echo "$ANDROID_HOME/platform-tools"; } >> "$GITHUB_PATH"
      - name: Build Android APK
        run: |
          set -euo pipefail
          npm install
          python3 -c "import struct, zlib; w=h=512; raw=(b'\x00'+b'\x84\xcc\x16\xff'*w)*h; chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          npx tauri icon app-icon.png
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-deps-install || npx tauri android init --ci
          fi
          if [ ! -d "src-tauri/gen/android/app/src/main/java" ]; then rm -rf src-tauri/gen/android && npx tauri android init; fi && python3 -c "from pathlib import Path; p = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml'); t = p.read_text(encoding='utf-8'); perms = ['<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />', '<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />']; t = t.replace('<application', '\n    '.join([''] + perms) + '\n    <application', 1) if 'ACCESS_FINE_LOCATION' not in t else t; p.write_text(t, encoding='utf-8'); print('Injected Android GPS permissions into', p)"
          npx tauri android build --debug --apk --target aarch64
          find src-tauri/gen/android -name "*.apk" -ls
      - uses: actions/upload-artifact@v4
        with:
          name: ApexTrail-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
