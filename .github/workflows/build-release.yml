name: Build ApexTrail OS

on:
push:
tags:
  - 'v*'
workflow_dispatch:

permissions:
contents: write

jobs:
build-windows:
runs-on: windows-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Rust
    uses: dtolnay/rust-toolchain@stable

  - name: Install dependencies, generate icon and build Windows EXE
    shell: bash
    run: |
      set -euo pipefail
      npm install
      python -c "import struct, zlib; w=h=512; raw=b''.join(b'\x00'+b'\x84\xcc\x16\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
      npx tauri icon app-icon.png
      npm run tauri build -- --bundles nsis

  - name: Upload Windows EXE artifact
    uses: actions/upload-artifact@v4
    with:
      name: ApexTrail-Windows-EXE
      path: src-tauri/target/release/bundle/nsis/*.exe

build-android:
runs-on: ubuntu-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Rust and Android targets
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: aarch64-linux-android,armv7-linux-androideabi

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android licenses, install NDK and build APK
    run: |
      set -euo pipefail
      yes | sdkmanager --licenses >/dev/null 2>&1 || true
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
      echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      npm install
      python3 -c "import struct, zlib; w=h=512; raw=b''.join(b'\x00'+b'\x84\xcc\x16\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('app-icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
      npx tauri icon app-icon.png
      npx tauri android init --ci --skip-deps-install || npx tauri android init --ci
      npx tauri android build --apk --target aarch64

  - name: Upload Android APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: ApexTrail-Android-APK
      path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
